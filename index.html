<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Evakuierungsprotokoll</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#111111">
<style>
:root{--bg:#111;--fg:#eee;--card:#1c1c1c;--line:#333;--in:#1f8f3a;--out:#b3261e;--muted:#999}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#clock{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:400}
.total{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.total b{font-size:28px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.totals .total{margin:0;flex-direction:column;align-items:flex-start;gap:4px}
.totals .total span{font-size:13px;color:var(--muted)}
.total.pat{border-color:#2a6fb0}
.grp.single{grid-template-columns:1fr 70px}
.pbtn{background:#2a6fb0}
input#name{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:#000;color:var(--fg);margin-bottom:10px}
.grp{display:grid;grid-template-columns:1fr 70px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.grp button{height:62px;font-size:17px;font-weight:600;border:none;border-radius:10px;color:#fff;cursor:pointer}
.grp button:active{transform:scale(.97);filter:brightness(1.3)}
.in{background:var(--in)}.out{background:var(--out)}
.cnt{text-align:center}
.cnt .n{font-size:24px;font-weight:700;display:block}
.cnt .l{font-size:11px;color:var(--muted)}
.neg{color:#ff6b6b}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tools button{flex:1;min-width:100px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--bg)}
td.d-in{color:#5fd27a}td.d-out{color:#ff7b72}
td .x{background:#3a1d1b;border:1px solid var(--out);color:#ff7b72;font-size:15px;border-radius:6px;padding:6px 10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:360px;width:100%}
#modal p{margin:0 0 14px;white-space:pre-line}
#modal .row{display:flex;gap:8px}
#modal button{flex:1;padding:14px;font-size:16px;border-radius:8px;border:none;color:#fff}
#mNo{background:#444}#mYes{background:var(--out)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
<h1>Evakuierungsprotokoll <span id="clock"></span></h1>

<div class="totals">
  <div class="total"><span>Helfer im Tunnel</span><b id="total">0</b></div>
  <div class="total pat"><span>Patienten evakuiert</span><b id="evac">0</b></div>
</div>

<input id="name" placeholder="Name / Kennung (optional)" autocomplete="off">

<div id="groups"></div>

<div class="tools">
  <button onclick="undo()">↶ Letzten rückgängig</button>
  <button onclick="exportCSV()">⬇ CSV-Export</button>
  <button onclick="resetAll()">🗑 Neuer Einsatz</button>
</div>

<table>
  <thead><tr><th>#</th><th>Zeit</th><th>Gruppe</th><th>Richtung</th><th>Name</th><th></th></tr></thead>
  <tbody id="log"></tbody>
</table>

<div id="toast"></div>
<div id="modal"><div class="box"><p id="mText"></p><div class="row"><button id="mNo">Abbrechen</button><button id="mYes">Löschen</button></div></div></div>

<script>
const GROUPS=["Feuerwehr","Rettung","Bergrettung","Andere","Patient"];
const KEY="tunnelProtokoll_v1";
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){data=[]}

function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast("⚠ Speichern im Browser fehlgeschlagen – CSV exportieren!")}}
function pad(n){return String(n).padStart(2,"0")}
function fmt(ts){const d=new Date(ts);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function fmtShort(ts){const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.opacity=1;clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,1500)}

function buildGroups(){
  const c=document.getElementById("groups");
  c.innerHTML=GROUPS.map((g,i)=>g==="Patient"?`
    <div class="grp single">
      <button class="pbtn" onclick="add(${i},'Raus')">Patient evakuiert ◀ raus</button>
      <div class="cnt"><span class="n" id="c${i}">0</span><span class="l">evakuiert</span></div>
    </div>`:`
    <div class="grp">
      <button class="in" onclick="add(${i},'Rein')">${g} ▶ rein</button>
      <div class="cnt"><span class="n" id="c${i}">0</span><span class="l">im Tunnel</span></div>
      <button class="out" onclick="add(${i},'Raus')">◀ raus</button>
    </div>`).join("");
}

function add(i,dir){
  const nameEl=document.getElementById("name");
  data.push({t:Date.now(),g:GROUPS[i],d:dir,n:nameEl.value.trim()});
  nameEl.value="";
  save();render();
  if(navigator.vibrate)navigator.vibrate(40);
  toast(GROUPS[i]+" "+dir.toLowerCase()+" "+fmtShort(Date.now()));
}
function ask(text,onYes){
  const m=document.getElementById("modal");
  document.getElementById("mText").textContent=text;
  m.style.display="flex";
  document.getElementById("mNo").onclick=()=>{m.style.display="none"};
  document.getElementById("mYes").onclick=()=>{m.style.display="none";onYes()};
}
function undo(){
  if(!data.length){toast("Keine Einträge");return}
  const e=data[data.length-1];
  ask("Letzten Eintrag löschen?\n"+fmt(e.t)+" – "+e.g+" "+e.d+(e.n?" ("+e.n+")":""),()=>{data.pop();save();render();toast("Gelöscht")});
}
function del(idx){
  const e=data[idx];
  ask("Eintrag #"+(idx+1)+" löschen?\n"+fmt(e.t)+" – "+e.g+" "+e.d+(e.n?" ("+e.n+")":""),()=>{data.splice(idx,1);save();render();toast("Gelöscht")});
}
function resetAll(){
  if(!data.length){toast("Keine Einträge");return}
  ask("ALLE "+data.length+" Einträge löschen und neuen Einsatz starten?\nVorher CSV exportieren!",()=>{data=[];save();render();toast("Alles gelöscht")});
}
function exportCSV(){
  if(!data.length){toast("Keine Daten");return}
  const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[["Nr","Datum/Zeit","Gruppe","Richtung","Name/Kennung"].join(";")];
  data.forEach((e,i)=>rows.push([i+1,fmt(e.t),e.g,e.d,esc(e.n)].join(";")));
  rows.push("");rows.push("Stand im Tunnel;"+fmt(Date.now()));
  GROUPS.filter(g=>g!=="Patient").forEach(g=>rows.push(g+";"+count(g)));
  rows.push("Helfer im Tunnel gesamt;"+helpers());
  rows.push("Patienten evakuiert;"+evacuated());
  const blob=new Blob(["\uFEFF"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  const d=new Date();
  a.href=URL.createObjectURL(blob);
  a.download=`evakuierungsprotokoll_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  document.body.appendChild(a);a.click();a.remove();
}
function evacuated(){return data.filter(e=>e.g==="Patient"&&e.d==="Raus").length}
function helpers(){return GROUPS.filter(g=>g!=="Patient").reduce((s,g)=>s+count(g),0)}
function count(g){return data.reduce((s,e)=>e.g===g?s+(e.d==="Rein"?1:-1):s,0)}

function render(){
  let tot=0;
  GROUPS.forEach((g,i)=>{
    const el=document.getElementById("c"+i);
    if(g==="Patient"){el.textContent=evacuated();el.className="n";return}
    const n=count(g);tot+=n;el.textContent=n;el.className="n"+(n<0?" neg":"")});
  const t=document.getElementById("total");t.textContent=tot;t.className=tot<0?"neg":"";
  document.getElementById("evac").textContent=evacuated();
  document.getElementById("log").innerHTML=data.map((e,i)=>({e,i})).reverse().map(({e,i})=>`
    <tr><td>${i+1}</td><td>${fmtShort(e.t)}</td><td>${e.g}</td>
    <td class="${e.d==="Rein"?"d-in":"d-out"}">${e.d}</td>
    <td>${e.n.replace(/</g,"&lt;")}</td>
    <td><button class="x" onclick="del(${i})">✕</button></td></tr>`).join("");
}
setInterval(()=>{const d=new Date();document.getElementById("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())},1000);
buildGroups();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e)))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
